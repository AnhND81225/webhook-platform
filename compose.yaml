# Local development only. Production uses AWS RDS for PostgreSQL.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - webhook-platform-postgres:/var/lib/postgresql/data

volumes:
  webhook-platform-postgres:
