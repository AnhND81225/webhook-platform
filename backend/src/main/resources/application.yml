spring:
  application:
    name: webhook-platform
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/webhook_platform}
    username: ${DATABASE_USERNAME:webhook}
    password: ${DATABASE_PASSWORD:webhook}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: WEBHOOK_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

webhook-platform:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  secret-encryption-key: ${WEBHOOK_SECRET_ENCRYPTION_KEY:}
  worker:
    enabled: ${WEBHOOK_WORKER_ENABLED:true}
    batch-size: ${WEBHOOK_WORKER_BATCH_SIZE:50}
    poll-interval: ${WEBHOOK_WORKER_POLL_INTERVAL:PT5S}
    connect-timeout: ${WEBHOOK_WORKER_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${WEBHOOK_WORKER_REQUEST_TIMEOUT:PT10S}
    stale-processing-timeout: ${WEBHOOK_WORKER_STALE_PROCESSING_TIMEOUT:PT5M}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
